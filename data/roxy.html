<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d17">
  <title>Roxy Universal Remote</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#090d17;--surface:#121a29;--surface-2:#192437;--line:#26354b;
      --text:#f4f7fc;--muted:#94a3b8;--accent:#58c4ee;--accent-2:#a5e7ff;
      --green:#38d99b;--red:#ff667d;--shadow:0 16px 38px rgba(0,0,0,.28)
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:20px 15px calc(28px + env(safe-area-inset-bottom));font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% -15%,#18324a 0,transparent 52%),var(--bg);color:var(--text)}
    button{font:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .app{width:min(100%,440px);margin:0 auto}
    .top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 18px}
    .brand{display:flex;align-items:center;gap:11px}
    .logo{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#1d5270,#143044);border:1px solid #34718e;color:#c7f2ff;font-size:22px;font-weight:900;box-shadow:0 8px 22px #0005}
    h1{font-size:19px;letter-spacing:.02em;margin:0;font-weight:800}
    .subtitle{font-size:11px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:2px}
    .universal-tag{border:1px solid #28516a;background:#10283a;color:#a9e9ff;border-radius:99px;padding:7px 10px;font-size:10px;font-weight:800;letter-spacing:.1em}
    .header-edit-toggle{border:1px solid #36536c;background:#13283a;color:#bdeeff;border-radius:99px;padding:9px 12px;font-size:11px;font-weight:800;white-space:nowrap}
    .header-edit-toggle.active{background:#24506a;border-color:#4b9bc0}
    .remote{background:linear-gradient(180deg,#172235,#101827);border:1px solid #2b3a50;border-radius:30px;padding:19px 17px 20px;box-shadow:var(--shadow),inset 0 1px #ffffff0b}
    .device-line{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin:0 0 17px}
    .device-chip{font-size:10px;letter-spacing:.04em;color:#b9c7d9;border:1px solid #314258;background:#111b2b;border-radius:99px;padding:6px 9px}
    .device-select{min-width:160px;border:1px solid #3a7794;background:#10283a;color:#dff7ff;border-radius:99px;padding:8px 13px;font:700 12px system-ui;outline:none}
    .section-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8092aa;font-weight:800;margin:18px 3px 10px}
    .power-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .key{border:1px solid #34445c;background:linear-gradient(180deg,#25344a,#1a273a);color:var(--text);border-radius:15px;min-height:53px;padding:10px 8px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:750;box-shadow:0 5px 0 #0b111d,0 8px 15px #0002;transition:transform .08s,border-color .15s,filter .15s}
    .key:active{transform:translateY(3px);box-shadow:0 2px 0 #0b111d,0 4px 9px #0002;filter:brightness(1.16)}
    .key:disabled{opacity:.55;cursor:wait}
    .key svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .key.power{background:linear-gradient(180deg,#632b3a,#3e202d);border-color:#8a4053;color:#ffdce3}
    .key.power svg{color:#ff8296}
    .key.primary{background:linear-gradient(180deg,#15516b,#12394f);border-color:#287c9d;color:#e0f8ff}
    .key.secondary{min-height:45px;font-size:13px}
    .key.soft{background:#131f30;border-color:#2b3b51;color:#c8d5e5;box-shadow:0 4px 0 #0b111d}
    .volume-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .volume{min-height:58px;font-size:14px}
    .volume .symbol{font-size:22px;line-height:1;color:var(--accent-2);font-weight:500}
    .dpad{width:min(100%,252px);margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,67px);gap:7px}
    .dpad .key{min-height:0;border-radius:18px;padding:0}
    .dpad .key svg{width:25px;height:25px}
    .dpad .center{background:linear-gradient(145deg,#1b526b,#14384e);border-color:#327b9a;color:#d8f6ff;font-size:13px;letter-spacing:.08em}
    .dpad .empty{visibility:hidden}
    .nav-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}
    .utility-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    .more-toggle{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:18px;border:1px solid #34455d;background:#101a29;color:#b8c8db;border-radius:14px;padding:13px;font-size:13px;font-weight:750}
    .more-toggle .plus{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:#1c3449;color:#9de4ff;font-size:17px}
    .more-panel{display:none;margin-top:13px;padding:14px;border:1px solid #2b3b51;border-radius:18px;background:#0e1725}
    .more-panel.open{display:block;animation:reveal .18s ease-out}
    @keyframes reveal{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
    .number-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    .number-grid .key{min-height:49px;font-size:17px}
    .media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
    .media-grid .key{min-height:45px;font-size:11px}
    .transport-grid{margin-top:17px;grid-template-columns:repeat(3,1fr)}
    .transport-grid .key{min-height:54px}
    .transport-grid .icon-key{gap:3px}
    .transport-grid .icon-key svg{width:23px;height:23px}
    .transport-grid .icon-key svg+svg{margin-left:-5px}
    .edit-bar{display:flex;gap:8px;margin-top:14px}
    .edit-toggle{flex:1;border:1px solid #36536c;background:#13283a;color:#bdeeff;border-radius:12px;padding:10px;font-size:12px;font-weight:750}
    .edit-toggle.active{background:#24506a;border-color:#4b9bc0}
    .keymap-modal{display:none;position:fixed;inset:0;z-index:10;background:#050912d9;padding:18px;overflow:auto;align-items:center;justify-content:center}
    .keymap-modal.open{display:flex}
    .keymap-card{width:min(100%,460px);max-height:90vh;overflow:auto;background:#121d2d;border:1px solid #36506c;border-radius:20px;padding:17px;box-shadow:var(--shadow)}
    .keymap-card h2{font-size:17px;margin:0 0 6px}
    .keymap-help{font-size:12px;color:var(--muted);margin:0 0 13px}
    .slot-editor{border:1px solid #2b3d54;border-radius:13px;padding:11px;margin:9px 0}
    .slot-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:750}
    .slot-fields{display:grid;grid-template-columns:95px 1fr;gap:8px}
    .slot-fields select,.slot-fields textarea{width:100%;background:#0b1421;color:var(--text);border:1px solid #344861;border-radius:8px;padding:8px;font:12px system-ui}
    .slot-fields textarea{min-height:65px;resize:vertical;grid-column:1/-1}
    .slot-empty{font-size:11px;color:var(--muted)}
    .modal-actions{display:flex;gap:8px;margin-top:14px}
    .modal-actions button{flex:1;border:1px solid #36516c;border-radius:10px;padding:11px;background:#1a3045;color:var(--text);font-weight:700}
    .modal-actions .cancel{background:#172131}
    .keymap-status{font-size:11px;color:var(--muted);margin-top:8px}
    .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:5;width:max-content;max-width:calc(100vw - 32px);padding:11px 15px;border-radius:12px;background:#17283a;border:1px solid #36516c;color:#eaf6ff;font-size:13px;font-weight:650;box-shadow:var(--shadow);transition:opacity .18s,transform .18s}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .toast.error{background:#3b202b;border-color:#854052;color:#ffe2e7}
    .sending{opacity:.7;filter:saturate(.7)}
    @media(max-width:360px){body{padding-left:10px;padding-right:10px}.remote{padding:15px 12px}.dpad{grid-template-rows:repeat(3,60px)}.key{font-size:13px}}
  </style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">R</div>
      <div><h1>ROXY</h1><div class="subtitle">Universal Remote</div></div>
    </div>
    <button class="header-edit-toggle" id="editKeymapToggle" type="button">Edit Tombol</button>
  </header>

  <section class="remote" aria-label="Remote universal Roxy">
    <div class="device-line" aria-label="Pilih remote yang dikendalikan">
      <label for="remoteSelect" class="device-chip">REMOTE AKTIF</label>
      <select id="remoteSelect" class="device-select" aria-label="Pilih remote">
        <option value="hg">HG680P</option><option value="tv">TV Polytron</option><option value="matrix">MATRIX</option>
      </select>
    </div>

    <div class="power-row">
      <button class="key power" data-action="power-all" aria-label="Power remote terpilih">
        <svg viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M5.6 5.6a9 9 0 1 0 12.8 0"/></svg>
        POWER
      </button>
      <button class="key soft" data-action="mute" aria-label="Mute">
        <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m17 9 5 6m0-6-5 6"/></svg>
        MUTE
      </button>
    </div>

    <div class="section-label" id="volumeLabel">Volume</div>
    <div class="volume-row">
      <button class="key primary volume" data-action="volume-down"><span class="symbol">−</span> VOLUME</button>
      <button class="key primary volume" data-action="volume-up"><span class="symbol">+</span> VOLUME</button>
    </div>

    <div class="section-label" id="navigationLabel">Navigasi</div>
    <div class="dpad" aria-label="Navigasi">
      <span class="empty"></span>
      <button class="key" data-action="up" aria-label="Atas"><svg viewBox="0 0 24 24"><path d="m5 14 7-7 7 7"/></svg></button>
      <span class="empty"></span>
      <button class="key" data-action="left" aria-label="Kiri"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg></button>
      <button class="key center" data-action="ok">OK</button>
      <button class="key" data-action="right" aria-label="Kanan"><svg viewBox="0 0 24 24"><path d="m10 5 7 7-7 7"/></svg></button>
      <span class="empty"></span>
      <button class="key" data-action="down" aria-label="Bawah"><svg viewBox="0 0 24 24"><path d="m5 10 7 7 7-7"/></svg></button>
      <span class="empty"></span>
    </div>

    <div class="nav-row">
      <button class="key secondary soft" data-action="back">BACK</button>
      <button class="key secondary soft" data-action="home">HOME</button>
      <button class="key secondary soft" data-action="menu">MENU</button>
    </div>
    <div class="utility-row" style="margin-top:9px">
      <button class="key secondary soft" data-action="info">INFO</button>
      <button class="key secondary soft" data-action="tv-av" title="TV / AV · belum ada kode, dapat diedit">TV / AV*</button>
      <button class="key secondary soft" data-action="epg">EPG</button>
    </div>

    <div class="media-grid transport-grid" aria-label="Kontrol multimedia">
      <button class="key secondary soft icon-key" data-action="rewind" aria-label="Rewind" title="Rewind"><svg viewBox="0 0 24 24"><path d="M11 5 3 12l8 7V5Zm10 0-8 7 8 7V5Z"/></svg></button>
      <button class="key secondary soft icon-key" data-action="play-pause" aria-label="Play/Pause" title="Play/Pause"><svg viewBox="0 0 24 24"><path d="M6 4v16l12-8L6 4Z"/></svg><svg viewBox="0 0 24 24"><path d="M7 5v14M17 5v14"/></svg></button>
      <button class="key secondary soft icon-key" data-action="fast-forward" aria-label="Fast Forward" title="Fast Forward"><svg viewBox="0 0 24 24"><path d="m3 5 8 7-8 7V5Zm10 0 8 7-8 7V5Z"/></svg></button>
      <button class="key secondary soft icon-key" data-action="before" aria-label="Previous" title="Previous"><svg viewBox="0 0 24 24"><path d="M5 5v14M19 5l-10 7 10 7V5Z"/></svg></button>
      <button class="key secondary soft icon-key" data-action="stop" aria-label="Stop" title="Stop"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg></button>
      <button class="key secondary soft icon-key" data-action="next" aria-label="Next" title="Next"><svg viewBox="0 0 24 24"><path d="M19 5v14M5 5l10 7-10 7V5Z"/></svg></button>
    </div>


    <button class="more-toggle" id="moreToggle" type="button" aria-expanded="false" aria-controls="morePanel">
      <span class="plus" id="toggleIcon">+</span>
      <span id="toggleText">Tampilkan tombol lainnya</span>
    </button>
    <div class="more-panel" id="morePanel" aria-hidden="true">
      <div class="section-label" style="margin-top:0">Papan angka</div>
      <div class="number-grid">
        <button class="key" data-action="digit-1">1</button>
        <button class="key" data-action="digit-2">2</button>
        <button class="key" data-action="digit-3">3</button>
        <button class="key" data-action="digit-4">4</button>
        <button class="key" data-action="digit-5">5</button>
        <button class="key" data-action="digit-6">6</button>
        <button class="key" data-action="digit-7">7</button>
        <button class="key" data-action="digit-8">8</button>
        <button class="key" data-action="digit-9">9</button>
        <span></span>
        <button class="key" data-action="digit-0">0</button>
        <span></span>
      </div>
      <div class="section-label">Kontrol tambahan</div>
      <div class="media-grid">
        <button class="key secondary soft" data-action="channel-down">CH −</button>
        <button class="key secondary soft" data-action="channel-up">CH +</button>
        <button class="key secondary soft" data-action="recall">RECALL</button>
        <button class="key secondary soft" data-action="txt">TXT</button>
        <button class="key secondary soft" data-action="set" title="SET · belum ada kode, dapat diedit">SET*</button>
        <button class="key secondary soft" data-action="app">APP</button>
      </div>
    </div>
  </section>
</main>
<div class="keymap-modal" id="keymapModal" role="dialog" aria-modal="true" aria-labelledby="keymapTitle">
  <div class="keymap-card">
    <h2 id="keymapTitle">Atur Keymap</h2>
    <p class="keymap-help" id="keymapHelp">Editor mengikuti remote yang sedang dipilih. Slot kosong tidak mengirim sinyal sampai diisi.</p>
    <div id="keymapSlots"></div>
    <div class="modal-actions">
      <button type="button" class="cancel" id="keymapCancel">Batal</button>
      <button type="button" id="keymapClear">Kosongkan semua</button>
      <button type="button" id="keymapSave">Simpan</button>
    </div>
    <div class="keymap-status" id="keymapStatus" aria-live="polite"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

    const command=defaultCommand(action,selectedDevice);
    return command ? [command] : [];
  }
  function updateRemoteLabels(){
    const names={tv:"TV Polytron",hg:"HG680P",matrix:"MATRIX"};
    document.getElementById("volumeLabel").textContent="Volume · "+names[selectedDevice];
    document.getElementById("navigationLabel").textContent="Navigasi · "+names[selectedDevice];
  }
  async function loadKeymap(){
    try{
      const response = await fetch("/api/keymap"+passQuery(),{cache:"no-store"});
      if(!response.ok) throw new Error("HTTP "+response.status);
      const data = await response.json();
      keymapOverrides = data && typeof data === "object" && data.keymap ? data.keymap : data;
      if(!keymapOverrides || typeof keymapOverrides !== "object" || Array.isArray(keymapOverrides)) keymapOverrides = {};
    }catch(error){
      keymapOverrides = {};
      document.getElementById("keymapStatus").textContent = "Keymap memakai mapping bawaan; penyimpanan API belum tersedia.";
    }
  }
  const keymapModal = document.getElementById("keymapModal");
  const keymapSlots = document.getElementById("keymapSlots");
  const deviceNames = {tv:"TV",hg:"HG680P",matrix:"MATRIX"};
  function commandText(command){
    if(!command) return "";
    return Array.isArray(command.data) ? command.data.join(",") : String(command.data || "");
  }
  function openKeymapEditor(action){
    editingAction=action;
    const device=selectedDevice;
    const command=keymapOverrides[action] && Object.prototype.hasOwnProperty.call(keymapOverrides[action],device)
      ? keymapOverrides[action][device] : defaultCommand(action,device);
    keymapSlots.innerHTML="";
    document.getElementById("keymapTitle").textContent="Keymap · "+deviceNames[device]+" · "+action.toUpperCase().replace(/-/g," ");
    const slot=document.createElement("section");slot.className="slot-editor";slot.dataset.device=device;
    const head=document.createElement("div");head.className="slot-head";head.textContent=deviceNames[device];
    const status=document.createElement("span");status.className="slot-empty";status.textContent=command?"Terisi":"Belum ada kode";head.appendChild(status);
    const fields=document.createElement("div");fields.className="slot-fields";
    const type=document.createElement("select");type.className="slot-type";
    [["raw","RAW"],["nec","NEC"]].forEach(function(pair){const o=document.createElement("option");o.value=pair[0];o.textContent=pair[1];type.appendChild(o);});
    type.value=command&&command.type?command.type.toLowerCase():"raw";
    const khz=document.createElement("input");khz.type="number";khz.min="1";khz.max="100";khz.value=command&&command.khz?command.khz:38;khz.className="slot-khz";khz.placeholder="kHz";khz.style.cssText="background:#0b1421;color:#f4f7fc;border:1px solid #344861;border-radius:8px;padding:8px";
    const length=document.createElement("input");length.type="number";length.min="1";length.max="64";length.value=command&&command.length?command.length:32;length.className="slot-length";length.placeholder="Bit";length.style.cssText=khz.style.cssText;
    const data=document.createElement("textarea");data.className="slot-data";data.placeholder=type.value==="raw"?"Durasi RAW dipisahkan koma":(device==="hg"?"Command HG680P (mis. 4A) atau frame NEC 32-bit":"Kode NEC hexadecimal");data.value=commandText(command);
    const clear=document.createElement("button");clear.type="button";clear.textContent="Kosongkan slot";clear.style.cssText="grid-column:1/-1;background:#34202b;color:#ffdce3;border:1px solid #704052;border-radius:8px;padding:8px";
    clear.addEventListener("click",function(){data.value="";status.textContent="Kosong";});
    fields.appendChild(type);fields.appendChild(type.value==="raw"?khz:length);fields.appendChild(data);fields.appendChild(clear);
    type.addEventListener("change",function(){fields.replaceChild(type.value==="raw"?khz:length,fields.children[1]);data.placeholder=type.value==="raw"?"Durasi RAW dipisahkan koma":(device==="hg"?"Command HG680P (mis. 4A) atau frame NEC 32-bit":"Kode NEC hexadecimal");});
    slot.appendChild(head);slot.appendChild(fields);keymapSlots.appendChild(slot);
    document.getElementById("keymapStatus").textContent="Perubahan hanya untuk "+deviceNames[device]+" pada tombol ini.";
    keymapModal.classList.add("open");
  }
  async function saveKeymap(){
    const updated=Object.assign({},keymapOverrides);
    const slot=keymapSlots.querySelector(".slot-editor");
    if(!slot)return;
    const device=slot.dataset.device,type=slot.querySelector(".slot-type").value,rawText=slot.querySelector(".slot-data").value.trim();
    const slots=Object.assign({},updated[editingAction]||{});
    if(!rawText){slots[device]=null;}
    else if(type==="raw"){
      const values=rawText.split(/[\\s,]+/).filter(Boolean).map(Number);
      if(!values.length||values.some(v=>!Number.isFinite(v)||v<=0||v>65535||!Number.isInteger(v))){document.getElementById("keymapStatus").textContent="RAW harus berupa angka durasi positif, dipisahkan koma.";return;}
      slots[device]={type:"raw",data:values,khz:Number(slot.querySelector(".slot-khz").value)||38,out:1};
    }else{
      const hex=rawText.replace(/^0x/i,"").replace(/\\s/g,"");
      if(!/^[0-9a-f]+$/i.test(hex)){document.getElementById("keymapStatus").textContent="Kode NEC harus berupa hexadecimal.";return;}
      let storedHex=hex.toUpperCase();
      let hgNecCommand=false;
      let storedLength=Number(slot.querySelector(".slot-length").value)||32;
      let hgNecFrame="";
      // A 1-byte NEC entry on the HG680P slot means a remote command byte,
      // not a complete NEC frame. Let the firmware compose 00 FF CMD ~CMD.
      if(device==="hg" && storedHex.length<=2){
        storedHex=storedHex.padStart(2,"0");
        hgNecCommand=true;
        storedLength=8;
        const inverse=(parseInt(storedHex,16)^0xFF).toString(16).padStart(2,"0").toUpperCase();
        hgNecFrame="00FF"+storedHex+inverse;
      }
      slots[device]={type:"nec",data:storedHex,length:storedLength,hgnec:hgNecCommand,out:1};
    }
    updated[editingAction]=slots;
    try{
      const response=await fetch("/api/keymap"+passQuery(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(updated)});
      if(!response.ok)throw new Error("HTTP "+response.status);
      keymapOverrides=updated;keymapModal.classList.remove("open");notify(hgNecFrame?"Keymap tersimpan · NEC "+hgNecFrame:"Keymap tersimpan");
    }catch(error){document.getElementById("keymapStatus").textContent="Gagal menyimpan keymap: "+error.message;}
  }

  const toast = document.getElementById("toast");
  let toastTimer;
  let busy = false;
  function notify(message, isError){
    toast.textContent = message;
    toast.className = "toast show" + (isError ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){toast.className="toast";},2600);
  }
  async function transmit(action, button){
    if(busy) return;
    const build = ACTIONS[action];
    if(!build){notify("Perintah belum tersedia",true);return;}
    const commands = actionCommands(action);
    if(!commands.length){notify("Kode tombol belum tersedia",true);return;}
    busy = true;
    const keyButtons=Array.from(document.querySelectorAll(".key"));
    const disabledBefore=keyButtons.map(function(key){return key.disabled;});
    keyButtons.forEach(function(key){key.disabled=true;});
    if(button) button.classList.add("sending");
    try{
      // Only the selected remote receives this command.
      for(const command of commands){
        const params = new URLSearchParams();
        params.set("plain",JSON.stringify([command]));
        const pass = new URLSearchParams(window.location.search).get("pass");
        if(pass) params.set("pass",pass);
        const response = await fetch("/json?"+params.toString(),{method:"GET",cache:"no-store"});
        if(!response.ok) throw new Error("HTTP "+response.status);
      }
      notify("Perintah dikirim · "+deviceNames[selectedDevice]);
    }catch(error){
      notify("Gagal mengirim perintah: "+error.message,true);
    }finally{
      busy = false;
      keyButtons.forEach(function(key,index){key.disabled=disabledBefore[index];});
      if(button) button.classList.remove("sending");
    }
  }

  document.querySelector(".remote").addEventListener("click",function(event){
    const button = event.target.closest("button[data-action]");
    if(!button) return;
    if(editKeymapMode){openKeymapEditor(button.dataset.action);return;}
    transmit(button.dataset.action,button);
  });

  document.getElementById("remoteSelect").addEventListener("change",function(){selectedDevice=this.value;updateRemoteLabels();});
  updateRemoteLabels();

  document.getElementById("editKeymapToggle").addEventListener("click",function(){
    editKeymapMode=!editKeymapMode;
    this.classList.toggle("active",editKeymapMode);
    this.textContent=editKeymapMode?"Selesai Edit":"Edit Tombol";
    notify(editKeymapMode?"Mode edit aktif: pilih tombol":"Mode edit selesai");
  });
  document.getElementById("keymapCancel").addEventListener("click",function(){keymapModal.classList.remove("open");});
  document.getElementById("keymapSave").addEventListener("click",saveKeymap);
  document.getElementById("keymapClear").addEventListener("click",function(){
    keymapSlots.querySelectorAll(".slot-data").forEach(function(field){field.value="";});
    document.getElementById("keymapStatus").textContent="Slot remote aktif akan dikosongkan.";
  });
  loadKeymap();

  const moreToggle = document.getElementById("moreToggle");
  const morePanel = document.getElementById("morePanel");
  moreToggle.addEventListener("click",function(){
    const open = !morePanel.classList.contains("open");
    morePanel.classList.toggle("open",open);
    morePanel.setAttribute("aria-hidden",String(!open));
    moreToggle.setAttribute("aria-expanded",String(open));
    document.getElementById("toggleIcon").textContent = open ? "−" : "+";
    document.getElementById("toggleText").textContent = open ? "Sembunyikan tombol lainnya" : "Tampilkan tombol lainnya";
  });
</script>
</body>
</html>
