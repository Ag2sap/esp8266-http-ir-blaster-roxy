name: PlatformIO Build

on:
  push:
    branches:
      - roxy-ui-first-draft
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-nodemcuv2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build NodeMCU V3 firmware
        run: pio run -e nodemcuv2
      - name: Build LittleFS image
        run: pio run -e nodemcuv2 -t buildfs

      - name: Upload firmware and LittleFS binaries
        uses: actions/upload-artifact@v4
        with:
          name: roxy-esp8266-build
          path: |
            .pio/build/nodemcuv2/firmware.bin
            .pio/build/nodemcuv2/littlefs.bin
          if-no-files-found: error
          retention-days: 14
