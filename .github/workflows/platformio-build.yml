name: PlatformIO Build

on:
  push:
    branches:
      - roxy-ui-first-draft
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-nodemcuv2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build NodeMCU V3 firmware
        run: pio run -e nodemcuv2
